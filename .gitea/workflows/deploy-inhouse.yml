name: Deploy JustProveIt in-house
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: justproveit-inhouse
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    runs-on: inhouse-linux
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_WHATSAPP_GATEWAY_CRM: 'true'
      NEXT_PUBLIC_API_BASE_URL: https://agents.launchingstack.com/api
      NEXT_PUBLIC_JPI_CRM_READ_API_BASE_URL: https://agents.launchingstack.com/api
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: npm ci --prefix api --ignore-scripts
      - run: node --test tests/proveit-email-links.test.mjs tests/bani-uk-ai-onboarding.test.cjs
      - run: npm run build
      - run: node infrastructure/inhouse/prepare-routing.mjs
      - run: python3 -m py_compile infrastructure/inhouse/pull-site.py infrastructure/inhouse/install-routing.py
      - run: docker build -t justproveit-inhouse-ci -f infrastructure/inhouse/Dockerfile .
      - name: Publish tested static export and original API handlers
        run: bash infrastructure/inhouse/publish.sh
