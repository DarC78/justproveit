name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: inhouse-linux
    name: Build and Deploy Job
    env:
      NEXT_PUBLIC_WHATSAPP_GATEWAY_CRM: "true"
      NEXT_PUBLIC_API_BASE_URL: https://launchingstack-func-dev.azurewebsites.net/api
      NEXT_PUBLIC_JPI_CRM_READ_API_BASE_URL: https://launchingstack-func-dev.azurewebsites.net/api
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # ✅ FORCE NODE 20 (CRITICAL FIX)
      - name: Use Node.js 20
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '20.11.0'

      - name: Test CRM lead search
        run: |
          npm ci
          npm run test:crm-lead-search
          node --test tests/crm-agent-telemetry.test.cjs tests/agent-report-productivity.test.cjs
          node --test tests/pension-calculator-layout.test.cjs
          node --test tests/pipeline-scheduled-table.test.cjs
          node --test tests/pension-agent-workflow.test.cjs
          node --test tests/scheduled-reply.test.cjs
          node --test tests/contact-start-simulation.test.cjs
          node --test tests/whatsapp-gateway-crm.test.cjs
          node --test tests/international-pension-case.test.cjs
          node --test tests/signwell-ipc.test.cjs
          node --test tests/lead-pipeline.test.cjs tests/pipeline-controls.test.cjs tests/all-whatsapp-messages.test.cjs tests/inbound-conversation-history.test.cjs tests/lead-private-data.test.cjs tests/crm-tab-navigation.test.cjs tests/next-best-actions.test.cjs tests/sms-history-reply.test.cjs
          node --test tests/crm-attention.test.cjs tests/auth-session.test.cjs tests/phone-history-performance.test.cjs tests/lead-details-phone-history.test.cjs tests/crm-email-history.test.cjs tests/whatsapp-reply-composer.test.cjs tests/contact-actions.test.cjs tests/contact-book-call.test.cjs tests/internal-lead-actions.test.cjs tests/call-transcription.test.cjs

      - name: Build And Deploy
        id: builddeploy
        uses: https://github.com/Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_BEACH_053C59810 }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "out"

  close_pull_request_job:
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: inhouse-linux
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: https://github.com/Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_BEACH_053C59810 }}
          action: "close"
