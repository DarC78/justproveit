name: Pull request checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: inhouse-linux
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_WHATSAPP_GATEWAY_CRM: 'true'
      NEXT_PUBLIC_API_BASE_URL: https://agents.launchingstack.com/api
      NEXT_PUBLIC_JPI_CRM_READ_API_BASE_URL: https://agents.launchingstack.com/api
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: npm ci --prefix api --ignore-scripts
      - name: Test frontend
        run: |
          node --test tests/google-purchase-confirmation.test.cjs tests/google-advertising-handoff.test.cjs
          npm run test:crm-lead-search
          node --test tests/crm-agent-telemetry.test.cjs tests/agent-report-productivity.test.cjs tests/agent-activity-chart.test.cjs
          node --test tests/pension-calculator-layout.test.cjs
          node --test tests/pipeline-scheduled-table.test.cjs
          node --test tests/pension-agent-workflow.test.cjs
          node --test tests/scheduled-reply.test.cjs
          node --test tests/upload-whatsapp-picture.test.cjs tests/whatsapp-day-download.test.cjs
          node --test tests/lead-private-workspace.test.cjs
          node --test tests/contact-start-simulation.test.cjs
          node --test tests/whatsapp-gateway-crm.test.cjs
          node --test tests/international-pension-case.test.cjs
          node --test tests/signwell-ipc.test.cjs
          node --test tests/lead-pipeline.test.cjs tests/pipeline-controls.test.cjs tests/all-whatsapp-messages.test.cjs tests/inbound-conversation-history.test.cjs tests/lead-private-data.test.cjs tests/crm-tab-navigation.test.cjs tests/next-best-actions.test.cjs tests/sms-history-reply.test.cjs
          node --test tests/crm-attention.test.cjs tests/auth-session.test.cjs tests/phone-history-performance.test.cjs tests/lead-details-phone-history.test.cjs tests/crm-email-history.test.cjs tests/whatsapp-reply-composer.test.cjs tests/contact-actions.test.cjs tests/contact-book-call.test.cjs tests/internal-lead-actions.test.cjs tests/call-transcription.test.cjs

      - name: Build frontend without deployment credentials
        run: npm run build
      - name: Verify internal API hosting and preserved email guards
        run: |
          node --test tests/proveit-email-links.test.mjs tests/bani-uk-ai-onboarding.test.cjs tests/bani-fulfillment-ledger.test.cjs
          apt-get update -qq && apt-get install -y --no-install-recommends nginx
          node infrastructure/inhouse/prepare-routing.mjs
          node infrastructure/inhouse/routing.integration.mjs
          python3 -m py_compile infrastructure/inhouse/pull-site.py infrastructure/inhouse/install-routing.py
          docker build -t justproveit-inhouse-pr -f infrastructure/inhouse/Dockerfile .
