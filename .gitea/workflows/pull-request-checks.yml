name: Pull request checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: inhouse-linux
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_WHATSAPP_GATEWAY_CRM: 'true'
      NEXT_PUBLIC_API_BASE_URL: https://launchingstack-func-dev.azurewebsites.net/api
      NEXT_PUBLIC_JPI_CRM_READ_API_BASE_URL: https://launchingstack-func-dev.azurewebsites.net/api
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - name: Test frontend
        run: node --test tests/*.test.cjs
      - name: Build frontend without deployment credentials
        run: npm run build
